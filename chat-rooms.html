<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat con Rooms - Relay v2.2</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    
    .app-container {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 1rem;
      height: 90vh;
    }
    
    .sidebar {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 1.5rem;
      overflow-y: auto;
    }
    
    .sidebar h2 {
      color: white;
      margin-bottom: 1rem;
      font-size: 1.25rem;
    }
    
    .room-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    
    .room-item {
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .room-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #e94560;
    }
    
    .room-item.active {
      background: linear-gradient(135deg, #e94560, #ff6b9d);
      border-color: transparent;
    }
    
    .room-item .name {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    
    .room-item .count {
      font-size: 0.75rem;
      opacity: 0.7;
    }
    
    .new-room {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    
    .new-room input {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: white;
      font-family: inherit;
      outline: none;
    }
    
    .new-room button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #e94560, #ff6b9d);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    
    .chat-container {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .chat-header {
      background: linear-gradient(135deg, #e94560, #ff6b9d);
      padding: 1.5rem;
      text-align: center;
    }
    
    .chat-header h1 {
      color: white;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.8);
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4444;
    }
    
    .status-dot.online {
      background: #00ff88;
      box-shadow: 0 0 10px #00ff88;
    }
    
    .users-bar {
      padding: 0.75rem 1.5rem;
      background: rgba(0,0,0,0.2);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.85rem;
      color: #aaa;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    
    .message {
      max-width: 80%;
      padding: 0.75rem 1rem;
      border-radius: 16px;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
    }
    
    .message.received {
      align-self: flex-start;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: #e0e0e0;
    }
    
    .message.sent {
      align-self: flex-end;
      background: linear-gradient(135deg, #e94560, #ff6b9d);
      color: white;
    }
    
    .message .user {
      font-size: 0.7rem;
      opacity: 0.7;
      margin-bottom: 0.25rem;
    }
    
    .message .text {
      font-size: 0.95rem;
      line-height: 1.4;
    }
    
    .message .time {
      font-size: 0.65rem;
      opacity: 0.5;
      text-align: right;
      margin-top: 0.25rem;
    }
    
    .message.system {
      align-self: center;
      background: transparent;
      color: #888;
      font-size: 0.8rem;
      text-align: center;
    }
    
    .chat-input {
      display: flex;
      gap: 0.5rem;
      padding: 1rem;
      background: rgba(0,0,0,0.3);
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    
    .chat-input input {
      flex: 1;
      padding: 0.875rem 1.25rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 25px;
      background: rgba(255,255,255,0.05);
      color: white;
      font-family: inherit;
      outline: none;
    }
    
    .chat-input input:focus {
      border-color: #e94560;
    }
    
    .chat-input input::placeholder {
      color: rgba(255,255,255,0.3);
    }
    
    .chat-input button {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, #e94560, #ff6b9d);
      color: white;
      font-size: 1.25rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .chat-input button:hover {
      transform: scale(1.1);
    }
    
    .login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    
    .login-box {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 2rem;
      text-align: center;
      width: 90%;
      max-width: 350px;
    }
    
    .login-box h2 {
      color: white;
      margin-bottom: 0.5rem;
    }
    
    .login-box p {
      color: #888;
      margin-bottom: 1.5rem;
    }
    
    .login-box input {
      width: 100%;
      padding: 1rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      color: white;
      font-family: inherit;
      margin-bottom: 1rem;
      outline: none;
    }
    
    .login-box button {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #e94560, #ff6b9d);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="login-overlay" id="login">
    <div class="login-box">
      <h2>💬 Chat con Rooms</h2>
      <p>Ingresa tu nombre para unirte</p>
      <input type="text" id="nombre" placeholder="Tu nombre..." autofocus onkeypress="if(event.key==='Enter') entrar()">
      <button onclick="entrar()">Entrar</button>
    </div>
  </div>

  <div class="app-container hidden" id="app">
    <div class="sidebar">
      <h2>🏠 Rooms</h2>
      <div class="new-room">
        <input type="text" id="newRoomName" placeholder="Nuevo room..." onkeypress="if(event.key==='Enter') crearRoom()">
        <button onclick="crearRoom()">+</button>
      </div>
      <div class="room-list" id="roomList">
        <div class="room-item active" data-room="general">
          <div class="name"># General</div>
          <div class="count">0 usuarios</div>
        </div>
      </div>
    </div>

    <div class="chat-container">
      <div class="chat-header">
        <h1 id="roomTitle"># General</h1>
        <div class="status">
          <span class="status-dot" id="dot"></span>
          <span id="estado">Desconectado</span>
        </div>
      </div>
      <div class="users-bar">Usuarios en este room: <span id="usuarios">0</span></div>
      <div class="chat-messages" id="mensajes"></div>
      <div class="chat-input">
        <input type="text" id="texto" placeholder="Escribe un mensaje..." disabled onkeypress="if(event.key==='Enter') enviarMensaje()">
        <button onclick="enviarMensaje()" id="btnEnviar" disabled>➤</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script>
    const RELAY_URL = 'https://demo.relay.coderic.net';
    const socket = io(`${RELAY_URL}/relay`, {
      transports: ['websocket', 'polling']
    });
    
    let usuario = null;
    let currentRoom = 'general';
    let rooms = new Set(['general']);
    let roomUsers = {};
    
    socket.on('connect', () => {
      document.getElementById('dot').classList.add('online');
      document.getElementById('estado').textContent = 'Conectado';
    });
    
    socket.on('disconnect', () => {
      document.getElementById('dot').classList.remove('online');
      document.getElementById('estado').textContent = 'Desconectado';
    });
    
    socket.on('relay', (data) => {
      if (data.tipo === 'mensaje' && data.room === currentRoom) {
        agregarMensaje(data.usuario, data.texto, data.usuario === usuario);
      } else if (data.tipo === 'usuario_entrado') {
        if (data.room === currentRoom) {
          actualizarUsuarios();
        }
      } else if (data.tipo === 'usuario_salido') {
        if (data.room === currentRoom) {
          actualizarUsuarios();
        }
      }
    });
    
    window.entrar = function() {
      const nombre = document.getElementById('nombre').value.trim();
      if (!nombre) return;
      
      usuario = nombre;
      socket.emit('identificar', usuario, (ok) => {
        if (ok) {
          document.getElementById('login').classList.add('hidden');
          document.getElementById('app').classList.remove('hidden');
          
          // Unirse al room general
          socket.emit('unirse', currentRoom, () => {
            socket.emit('relay', {
              destino: 'room',
              room: currentRoom,
              tipo: 'usuario_entrado',
              usuario,
              room: currentRoom
            });
            actualizarUsuarios();
          });
        }
      });
    };
    
    window.crearRoom = function() {
      const name = document.getElementById('newRoomName').value.trim();
      if (!name || rooms.has(name)) return;
      
      rooms.add(name);
      const roomItem = document.createElement('div');
      roomItem.className = 'room-item';
      roomItem.dataset.room = name;
      roomItem.innerHTML = `
        <div class="name"># ${name}</div>
        <div class="count">0 usuarios</div>
      `;
      roomItem.onclick = () => cambiarRoom(name);
      document.getElementById('roomList').appendChild(roomItem);
      document.getElementById('newRoomName').value = '';
    };
    
    function cambiarRoom(room) {
      // Salir del room actual
      socket.emit('relay', {
        destino: 'room',
        room: currentRoom,
        tipo: 'usuario_salido',
        usuario,
        room: currentRoom
      });
      
      // Unirse al nuevo room
      currentRoom = room;
      socket.emit('unirse', room, () => {
        document.getElementById('roomTitle').textContent = `# ${room}`;
        document.querySelectorAll('.room-item').forEach(item => {
          item.classList.toggle('active', item.dataset.room === room);
        });
        document.getElementById('mensajes').innerHTML = '';
        
        socket.emit('relay', {
          destino: 'room',
          room: room,
          tipo: 'usuario_entrado',
          usuario,
          room: room
        });
        actualizarUsuarios();
      });
    }
    
    window.enviarMensaje = function() {
      const texto = document.getElementById('texto').value.trim();
      if (!texto) return;
      
      socket.emit('relay', {
        destino: 'room',
        room: currentRoom,
        tipo: 'mensaje',
        usuario,
        texto,
        timestamp: Date.now()
      });
      
      document.getElementById('texto').value = '';
    };
    
    function agregarMensaje(user, text, isSent) {
      const div = document.createElement('div');
      div.className = `message ${isSent ? 'sent' : 'received'}`;
      div.innerHTML = `
        <div class="user">${user}</div>
        <div class="text">${text}</div>
        <div class="time">${new Date().toLocaleTimeString()}</div>
      `;
      document.getElementById('mensajes').appendChild(div);
      document.getElementById('mensajes').scrollTop = document.getElementById('mensajes').scrollHeight;
    }
    
    function actualizarUsuarios() {
      // En una implementación real, el servidor debería mantener el conteo
      // Por ahora, solo mostramos un placeholder
      document.getElementById('usuarios').textContent = '...';
    }
    
    // Habilitar input al conectar
    socket.on('connect', () => {
      document.getElementById('texto').disabled = false;
      document.getElementById('btnEnviar').disabled = false;
    });
  </script>
</body>
</html>
