<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat con Video - Relay v2.2</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      padding: 1rem;
    }
    
    .app-container {
      max-width: 1600px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 350px 1fr 300px;
      gap: 1rem;
      height: calc(100vh - 2rem);
    }
    
    .sidebar {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    
    .sidebar h2 {
      color: white;
      margin-bottom: 1rem;
      font-size: 1.25rem;
    }
    
    .participants-section {
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .participants-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .participant-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      transition: background 0.2s;
    }
    
    .participant-item:hover {
      background: rgba(255,255,255,0.08);
    }
    
    .participant-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e94560, #ff6b9d);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 0.875rem;
      flex-shrink: 0;
    }
    
    .participant-info {
      flex: 1;
      min-width: 0;
    }
    
    .participant-name {
      color: white;
      font-size: 0.875rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .participant-status {
      font-size: 0.7rem;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #888;
    }
    
    .status-dot.connected {
      background: #00ff88;
      box-shadow: 0 0 6px #00ff88;
    }
    
    .status-dot.connecting {
      background: #ffaa00;
    }
    
    .status-dot.disconnected {
      background: #ff4444;
    }
    
    .participant-you {
      background: rgba(233, 69, 96, 0.2);
      border: 1px solid rgba(233, 69, 96, 0.3);
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    
    .message {
      padding: 0.75rem 1rem;
      border-radius: 12px;
      max-width: 85%;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
    }
    
    .message.received {
      align-self: flex-start;
      background: rgba(255,255,255,0.08);
      color: #e0e0e0;
    }
    
    .message.sent {
      align-self: flex-end;
      background: linear-gradient(135deg, #e94560, #ff6b9d);
      color: white;
    }
    
    .message .user {
      font-size: 0.7rem;
      opacity: 0.7;
      margin-bottom: 0.25rem;
    }
    
    .message .text {
      font-size: 0.9rem;
      line-height: 1.4;
    }
    
    .chat-input {
      display: flex;
      gap: 0.5rem;
    }
    
    .chat-input input {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      color: white;
      font-family: inherit;
      outline: none;
    }
    
    .chat-input button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #e94560, #ff6b9d);
      color: white;
      cursor: pointer;
    }
    
    .video-container {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
    }
    
    .video-header {
      color: white;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .video-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
      min-height: 200px;
    }
    
    .video-item {
      position: relative;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 16/9;
    }
    
    .video-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .video-label {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      z-index: 10;
    }
    
    .video-status {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.75rem;
      z-index: 10;
    }
    
    .video-status.connected {
      background: rgba(0,255,0,0.7);
    }
    
    .video-status.connecting {
      background: rgba(255,165,0,0.7);
    }
    
    .video-status.failed {
      background: rgba(255,0,0,0.7);
    }
    
    .video-controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      padding: 1rem;
      background: rgba(0,0,0,0.3);
      border-radius: 16px;
    }
    
    .video-controls button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .video-controls button:hover {
      background: rgba(255,255,255,0.2);
    }
    
    .video-controls button.active {
      background: linear-gradient(135deg, #e94560, #ff6b9d);
    }
    
    .status-panel {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    
    .status-panel h2 {
      color: white;
      margin-bottom: 1rem;
      font-size: 1.25rem;
    }
    
    .status-item {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    
    .status-item label {
      display: block;
      color: #aaa;
      font-size: 0.75rem;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .status-item .value {
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
    }
    
    .status-item .value.connected {
      color: #00ff88;
    }
    
    .status-item .value.disconnected {
      color: #ff4444;
    }
    
    .status-item .value.connecting {
      color: #ffaa00;
    }
    
    .logs {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 1rem;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      color: #aaa;
    }
    
    .log-entry {
      margin-bottom: 0.25rem;
      padding: 0.25rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    
    .log-entry.info { color: #4fc3f7; }
    .log-entry.success { color: #00ff88; }
    .log-entry.warning { color: #ffaa00; }
    .log-entry.error { color: #ff4444; }
    
    .login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    
    .login-box {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 2rem;
      text-align: center;
      width: 90%;
      max-width: 350px;
    }
    
    .login-box h2 {
      color: white;
      margin-bottom: 0.5rem;
    }
    
    .login-box p {
      color: #888;
      margin-bottom: 1.5rem;
    }
    
    .login-box input {
      width: 100%;
      padding: 1rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      color: white;
      font-family: inherit;
      margin-bottom: 1rem;
      outline: none;
    }
    
    .login-box button {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #e94560, #ff6b9d);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    
    .hidden {
      display: none !important;
    }
    
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #888;
      text-align: center;
      padding: 2rem;
    }
    
    .empty-state h3 {
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="login-overlay" id="login">
    <div class="login-box">
      <h2>💬📹 Chat con Video</h2>
      <p>Ingresa tu nombre para unirte</p>
      <input type="text" id="nombre" placeholder="Tu nombre..." autofocus onkeypress="if(event.key==='Enter') entrar()">
      <button onclick="entrar()">Entrar</button>
    </div>
  </div>

  <div class="app-container hidden" id="app">
    <div class="sidebar">
      <div class="participants-section">
        <h2>👥 Participantes</h2>
        <div class="participants-list" id="participantsList">
          <div class="participant-item participant-you">
            <div class="participant-avatar" id="myAvatar">-</div>
            <div class="participant-info">
              <div class="participant-name" id="myName">-</div>
              <div class="participant-status">
                <span class="status-dot connected"></span>
                <span>Conectado</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <h2>💬 Chat</h2>
      <div class="chat-messages" id="mensajes"></div>
      <div class="chat-input">
        <input type="text" id="texto" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter') enviarMensaje()">
        <button onclick="enviarMensaje()">➤</button>
      </div>
    </div>

    <div class="video-container">
      <div class="video-header">
        <h2>📹 Video Llamada</h2>
        <div id="roomInfo">Room: <span id="roomName">-</span></div>
      </div>
      <div class="video-grid" id="videoGrid">
        <div class="empty-state">
          <h3>📹</h3>
          <p>Esperando participantes...</p>
        </div>
      </div>
      <div class="video-controls">
        <button id="audioBtn" onclick="toggleAudio()">🎤 Audio</button>
        <button id="videoBtn" onclick="toggleVideo()">📹 Video</button>
        <button onclick="shareScreen()">🖥️ Pantalla</button>
        <button onclick="salir()">🚪 Salir</button>
      </div>
    </div>

    <div class="status-panel">
      <h2>📊 Estado</h2>
      
      <div class="status-item">
        <label>Socket.io</label>
        <div class="value" id="socketStatus">Desconectado</div>
      </div>
      
      <div class="status-item">
        <label>Usuario</label>
        <div class="value" id="userStatus">-</div>
      </div>
      
      <div class="status-item">
        <label>Room</label>
        <div class="value" id="roomStatus">-</div>
      </div>
      
      <div class="status-item">
        <label>Peers Conectados</label>
        <div class="value" id="peersCount">0</div>
      </div>
      
      <div class="status-item">
        <label>STUN Servers</label>
        <div class="value" style="font-size: 0.75rem; color: #aaa;">
          • stun.l.google.com<br>
          • stun1.l.google.com<br>
          • stun.cloudflare.com
        </div>
      </div>
      
      <div class="status-item">
        <label>Logs</label>
        <div class="logs" id="logs"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script src="webrtc-manager.js"></script>
  <script>
    const RELAY_URL = 'wss://demo.relay.coderic.net';
    const socket = io(`${RELAY_URL}/relay`, {
      transports: ['websocket', 'polling']
    });
    
    let usuario = null;
    let webrtc = null;
    let audioEnabled = true;
    let videoEnabled = true;
    let localStream = null;
    const roomId = 'video-chat-room';
    let peerConnections = new Map();
    let participants = new Map(); // peerId -> { name, state, socketId }
    let logCount = 0;

    function addLog(message, type = 'info') {
      const logs = document.getElementById('logs');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logs.appendChild(entry);
      logs.scrollTop = logs.scrollHeight;
      logCount++;
      if (logCount > 50) {
        logs.removeChild(logs.firstChild);
        logCount--;
      }
    }

    function updateStatus(id, value, className = '') {
      const el = document.getElementById(id);
      if (el) {
        el.textContent = value;
        el.className = `value ${className}`;
      }
    }

    function updatePeerCount() {
      updateStatus('peersCount', peerConnections.size.toString());
      updateParticipantsList();
    }
    
    function getInitials(name) {
      return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
    }
    
    function updateParticipantsList() {
      const list = document.getElementById('participantsList');
      // Limpiar lista (excepto el item "Tú")
      const myItem = list.querySelector('.participant-you');
      list.innerHTML = '';
      if (myItem) {
        list.appendChild(myItem);
      }
      
      // Agregar otros participantes
      participants.forEach((participant, peerId) => {
        if (participant.name !== usuario) {
          const item = document.createElement('div');
          item.className = 'participant-item';
          item.id = `participant-${peerId}`;
          
          const avatar = document.createElement('div');
          avatar.className = 'participant-avatar';
          avatar.textContent = getInitials(participant.name);
          
          const info = document.createElement('div');
          info.className = 'participant-info';
          
          const name = document.createElement('div');
          name.className = 'participant-name';
          name.textContent = participant.name;
          
          const status = document.createElement('div');
          status.className = 'participant-status';
          
          const statusDot = document.createElement('span');
          statusDot.className = `status-dot ${participant.state || 'connecting'}`;
          
          const statusText = document.createElement('span');
          const stateText = {
            'connected': 'Conectado',
            'connecting': 'Conectando...',
            'disconnected': 'Desconectado',
            'failed': 'Error'
          };
          statusText.textContent = stateText[participant.state] || 'Conectando...';
          
          status.appendChild(statusDot);
          status.appendChild(statusText);
          info.appendChild(name);
          info.appendChild(status);
          item.appendChild(avatar);
          item.appendChild(info);
          
          list.appendChild(item);
        }
      });
    }
    
    function addParticipant(peerId, name, state = 'connecting') {
      participants.set(peerId, { name, state, socketId: peerId });
      updateParticipantsList();
    }
    
    function updateParticipantState(peerId, state) {
      const participant = participants.get(peerId);
      if (participant) {
        participant.state = state;
        updateParticipantsList();
      }
    }
    
    function removeParticipant(peerId) {
      participants.delete(peerId);
      updateParticipantsList();
    }

    socket.on('connect', () => {
      addLog('Conectado a Relay', 'success');
      updateStatus('socketStatus', 'Conectado', 'connected');
    });

    socket.on('disconnect', () => {
      addLog('Desconectado de Relay', 'error');
      updateStatus('socketStatus', 'Desconectado', 'disconnected');
    });

    socket.on('connect_error', (error) => {
      addLog(`Error de conexión: ${error.message}`, 'error');
      updateStatus('socketStatus', 'Error', 'disconnected');
    });

    window.entrar = async function() {
      const nombre = document.getElementById('nombre').value.trim();
      if (!nombre) return;
      
      usuario = nombre;
      socket.emit('identificar', usuario, async (ok) => {
        if (ok) {
          addLog(`Identificado como: ${usuario}`, 'success');
          updateStatus('userStatus', usuario);
          updateStatus('roomStatus', roomId);
          
          // Actualizar mi información en la lista
          document.getElementById('myName').textContent = usuario;
          document.getElementById('myAvatar').textContent = getInitials(usuario);
          addParticipant(socket.id, usuario, 'connected');
          
          document.getElementById('login').classList.add('hidden');
          document.getElementById('app').classList.remove('hidden');
          
          // Iniciar video
          try {
            addLog('Solicitando acceso a cámara/micrófono...', 'info');
            localStream = await navigator.mediaDevices.getUserMedia({
              video: true,
              audio: true
            });
            addLog('Acceso a medios concedido', 'success');
            
            webrtc = new WebRTCManager(socket);
            webrtc.onRemoteStream = (peerId, stream) => {
              addLog(`Stream remoto recibido de: ${peerId.substring(0, 8)}...`, 'success');
              // Intentar obtener el nombre del peer desde el mensaje de relay
              const participant = participants.get(peerId);
              const displayName = participant?.name || `Usuario ${peerId.substring(0, 6)}`;
              addVideoElement(peerId, stream, displayName);
              peerConnections.set(peerId, { state: 'connected', stream });
              updateParticipantState(peerId, 'connected');
              updatePeerCount();
              updateVideoStatus(peerId, 'connected');
            };
            
            webrtc.onPeerDisconnected = (peerId) => {
              addLog(`Peer desconectado: ${peerId.substring(0, 8)}...`, 'warning');
              const videoElement = document.getElementById(`video-${peerId}`);
              if (videoElement) videoElement.remove();
              peerConnections.delete(peerId);
              removeParticipant(peerId);
              updatePeerCount();
            };
            
            webrtc.onConnectionStateChange = (peerId, state) => {
              addLog(`Peer ${peerId.substring(0, 8)}... estado: ${state}`, 'info');
              const peer = peerConnections.get(peerId);
              if (peer) {
                peer.state = state;
                updateVideoStatus(peerId, state);
              }
              updateParticipantState(peerId, state);
            };
            
            await webrtc.setLocalStream(localStream);
            addLog(`Uniéndose a room: ${roomId}`, 'info');
            await webrtc.joinRoom(roomId);
            
            addVideoElement('local', localStream, usuario + ' (Tú)', true);
            document.getElementById('roomName').textContent = roomId;
            addLog('Esperando otros participantes...', 'info');
          } catch (error) {
            addLog(`Error al acceder a medios: ${error.message}`, 'error');
            console.error('Error al acceder a medios:', error);
            alert('Error al acceder a cámara/micrófono: ' + error.message);
          }
        } else {
          addLog('Error al identificarse', 'error');
        }
      });
    };

    function updateVideoStatus(peerId, state) {
      const videoItem = document.getElementById(`video-${peerId}`);
      if (videoItem) {
        let statusEl = videoItem.querySelector('.video-status');
        if (!statusEl) {
          statusEl = document.createElement('div');
          statusEl.className = 'video-status';
          videoItem.appendChild(statusEl);
        }
        statusEl.textContent = state;
        statusEl.className = `video-status ${state}`;
      }
    }

    window.enviarMensaje = function() {
      const texto = document.getElementById('texto').value.trim();
      if (!texto) return;
      
      socket.emit('relay', {
        destino: 'room',
        room: roomId,
        tipo: 'mensaje',
        usuario,
        texto,
        timestamp: Date.now()
      });
      
      agregarMensaje(usuario, texto, true);
      document.getElementById('texto').value = '';
    };

    socket.on('relay', (data) => {
      if (data.tipo === 'mensaje' && data.room === roomId) {
        agregarMensaje(data.usuario, data.texto, data.usuario === usuario);
      }
      
      // Detectar cuando un nuevo usuario se une (por su mensaje o identificación)
      if (data.tipo === 'webrtc:peer-joined' && data.socketId) {
        // El nombre del usuario puede venir en el mensaje o necesitamos pedirlo
        // Por ahora usamos el socketId como identificador temporal
        const tempName = `Usuario ${data.socketId.substring(0, 6)}`;
        if (!participants.has(data.socketId)) {
          addParticipant(data.socketId, tempName, 'connecting');
        }
      }
    });

    function agregarMensaje(user, text, isSent) {
      const div = document.createElement('div');
      div.className = `message ${isSent ? 'sent' : 'received'}`;
      div.innerHTML = `
        <div class="user">${user}</div>
        <div class="text">${text}</div>
      `;
      document.getElementById('mensajes').appendChild(div);
      document.getElementById('mensajes').scrollTop = document.getElementById('mensajes').scrollHeight;
    }

    function addVideoElement(id, stream, label, muted = false) {
      // Remover empty state si existe
      const emptyState = document.querySelector('.empty-state');
      if (emptyState) emptyState.remove();
      
      const container = document.createElement('div');
      container.className = 'video-item';
      container.id = `video-${id}`;
      
      const video = document.createElement('video');
      video.autoplay = true;
      video.playsInline = true;
      video.muted = muted;
      video.srcObject = stream;
      
      const labelDiv = document.createElement('div');
      labelDiv.className = 'video-label';
      labelDiv.textContent = label;
      
      container.appendChild(video);
      container.appendChild(labelDiv);
      document.getElementById('videoGrid').appendChild(container);
    }

    window.toggleAudio = function() {
      audioEnabled = !audioEnabled;
      if (webrtc) webrtc.toggleAudio(audioEnabled);
      document.getElementById('audioBtn').classList.toggle('active', audioEnabled);
      addLog(`Audio ${audioEnabled ? 'activado' : 'desactivado'}`, 'info');
    };

    window.toggleVideo = function() {
      videoEnabled = !videoEnabled;
      if (webrtc) webrtc.toggleVideo(videoEnabled);
      document.getElementById('videoBtn').classList.toggle('active', videoEnabled);
      addLog(`Video ${videoEnabled ? 'activado' : 'desactivado'}`, 'info');
    };

    window.shareScreen = async function() {
      try {
        addLog('Solicitando compartir pantalla...', 'info');
        const screenStream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });
        await webrtc.setLocalStream(screenStream);
        const localVideo = document.querySelector('#video-local video');
        if (localVideo) localVideo.srcObject = screenStream;
        localStream = screenStream;
        addLog('Pantalla compartida', 'success');
      } catch (error) {
        addLog(`Error compartiendo pantalla: ${error.message}`, 'error');
        console.error('Error compartiendo pantalla:', error);
      }
    };

    window.salir = function() {
      if (webrtc) webrtc.destroy();
      if (localStream) localStream.getTracks().forEach(track => track.stop());
      window.location.reload();
    };

    // Interceptar console.log de WebRTC para mostrar en UI
    const originalLog = console.log;
    console.log = function(...args) {
      originalLog.apply(console, args);
      const message = args.join(' ');
      if (message.includes('[WebRTC]')) {
        const type = message.includes('Error') || message.includes('falló') ? 'error' :
                     message.includes('completado') || message.includes('recibido') ? 'success' :
                     message.includes('estado') ? 'info' : 'info';
        addLog(message.replace('[WebRTC] ', ''), type);
      }
    };
  </script>
</body>
</html>
